<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodConnect - Secure Gateway & Registration</title>
    <style>
        /* =========================================
           1. CSS Variables - Theme Management
           ========================================= */
        :root {
            --maroon-dark: #800000;
            --maroon-mid: #b30000;
            --maroon-accent: #e60000; 
            
            --bg-base: #ffffff;
            --bg-offset: #f7f3f3;
            --text-primary: #333333;
            --text-secondary: #555555;
            
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.5);
            
            --input-bg: rgba(255, 255, 255, 0.6);
            --btn-text: #ffffff;
            
            --blob-color: rgba(204, 0, 0, 0.65);
            --blob-color-alt: rgba(255, 51, 51, 0.5); 
            
            --card-shadow: 0 8px 32px 0 rgba(102, 0, 0, 0.2);
        }

        [data-theme="dark"] {
            --bg-base: #1a0000;
            --bg-offset: #2d0000;
            --text-primary: #f7f3f3;
            --text-secondary: #cccccc;
            --glass-bg: rgba(102, 0, 0, 0.3);
            --glass-border: rgba(153, 0, 0, 0.3);
            --input-bg: rgba(0, 0, 0, 0.4);
            --blob-color: rgba(230, 0, 0, 0.5);
            --blob-color-alt: rgba(255, 77, 77, 0.4);
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* =========================================
           2. Core Reset & Typography
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            position: relative;
        }

        /* =========================================
           3. Dynamic Lava Lamp Background
           ========================================= */
        .lava-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            filter: blur(80px); 
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            animation: moveBlobs 15s infinite alternate ease-in-out;
            opacity: 0.85;
        }

        .blob:nth-child(1) { width: 500px; height: 500px; background: var(--blob-color); top: -10%; left: -10%; animation-duration: 18s; }
        .blob:nth-child(2) { width: 400px; height: 400px; background: var(--blob-color-alt); bottom: -10%; right: 5%; animation-duration: 12s; animation-delay: 2s; }
        .blob:nth-child(3) { width: 600px; height: 600px; background: var(--blob-color); top: 30%; left: 40%; animation-duration: 20s; animation-delay: 4s; }
        .blob:nth-child(4) { width: 350px; height: 350px; background: var(--blob-color-alt); top: 60%; left: 5%; animation-duration: 10s; }
        .blob:nth-child(5) { width: 450px; height: 450px; background: var(--blob-color); top: 10%; right: 15%; animation-duration: 16s; animation-delay: 1s; }

        @keyframes moveBlobs {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20vw, 15vh) scale(1.15); }
            100% { transform: translate(-15vw, 30vh) scale(0.9); }
        }

        /* =========================================
           4. Glassmorphism Container & Animations
           ========================================= */
        .app-container {
            width: 90%;
            max-width: 450px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 40px 35px;
            box-shadow: var(--card-shadow);
            z-index: 10;
            max-height: 90vh;
            overflow-y: auto;
            transition: max-width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-container::-webkit-scrollbar { width: 6px; }
        .app-container::-webkit-scrollbar-thumb { background: var(--maroon-mid); border-radius: 10px; }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-area h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--maroon-mid);
            text-transform: uppercase;
            cursor: pointer;
        }
        .logo-area p { font-size: 14px; color: var(--text-secondary); margin-top: 5px; }

        /* =========================================
           5. Role Selection Tabs
           ========================================= */
        .role-prompt {
            text-align: center;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-secondary);
        }

        .role-tabs {
            display: flex;
            justify-content: space-between;
            background: var(--input-bg);
            border-radius: 14px;
            padding: 6px;
            margin-bottom: 25px;
            border: 1px solid var(--glass-border);
        }

        .role-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            opacity: 0.7;
        }

        .role-tab.active {
            background: var(--maroon-mid);
            color: var(--btn-text);
            opacity: 1;
            box-shadow: 0 4px 12px rgba(179, 0, 0, 0.3);
        }

        /* =========================================
           6. Form Elements
           ========================================= */
        .form-group { margin-bottom: 18px; }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            -webkit-appearance: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--maroon-accent);
            box-shadow: 0 0 0 3px rgba(230, 0, 0, 0.2);
        }

        .primary-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--maroon-accent), var(--maroon-mid));
            color: var(--btn-text);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(204, 0, 0, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(204, 0, 0, 0.5);
        }

        .extra-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 13px;
        }

        .extra-links a { color: var(--maroon-mid); text-decoration: none; font-weight: 600; cursor: pointer; }
        .extra-links a:hover { text-decoration: underline; color: var(--maroon-accent); }

        .back-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            cursor: pointer;
            color: var(--maroon-mid);
            font-weight: 600;
        }

        .settings-panel { position: absolute; top: 20px; right: 20px; z-index: 100; }
        .theme-toggle {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px); padding: 10px 15px; border-radius: 20px;
            cursor: pointer; color: var(--text-primary); font-weight: 600; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="lava-background">
        <div class="blob"></div><div class="blob"></div><div class="blob"></div>
        <div class="blob"></div><div class="blob"></div>
    </div>

    <div class="settings-panel">
        <button class="theme-toggle" onclick="toggleTheme()" id="themeToggleButton">🌓 Change Theme</button>
    </div>

    <div class="app-container" id="appContainer">
        
        <div class="logo-area" onclick="resetToHome()">
            <!-- Using the local bloodlogo.jpeg here -->
            <img src="bloodlogo.jpeg" alt="BloodConnect Logo" style="width: 85px; height: auto; border-radius: 12px; margin-bottom: 12px; background-color: #ffffff; padding: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
            <h1>BloodConnect</h1>
            <p id="subTitle">Select your role to continue</p>
        </div>

        <!-- Section 1: Role Selection & Login -->
        <div id="loginView" class="fade-in">
            <div class="role-prompt" id="rolePrompt">I am a...</div>
            <div class="role-tabs">
                <div class="role-tab active" id="tabDonor" onclick="selectRole('donor', this)">Donor</div>
                <div class="role-tab" id="tabHospital" onclick="selectRole('hospital', this)">Hospital</div>
                <div class="role-tab" id="tabAdmin" onclick="selectRole('admin', this)">Admin</div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label id="userIdLabel">Application ID / Mobile Number</label>
                    <input type="text" id="userIdInput" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" required>
                </div>
                <button type="submit" class="primary-btn">Secure Sign In</button>
                <div class="extra-links">
                    <a href="#">Forgot Password?</a>
                    <a id="registerLink" onclick="showRegistration()">Sign Up as New Donor</a>
                </div>
            </form>
        </div>

        <!-- Section 2: Donor Registration Page -->
        <div id="registrationView" class="hidden">
            <form id="registrationForm" onsubmit="event.preventDefault(); alert('Registration submitted for Verification!'); resetToHome();">
                
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter legally registered name" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input type="tel" placeholder="10-digit number" required>
                    </div>
                    <div class="form-group">
                        <label>Email (Optional)</label>
                        <input type="email" placeholder="Email address">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" required>
                    </div>
                    <div class="form-group">
                        <label>Blood Group</label>
                        <select required>
                            <option value="" disabled selected>Select</option>
                            <option value="A+">A+</option><option value="A-">A-</option>
                            <option value="B+">B+</option><option value="B-">B-</option>
                            <option value="O+">O+</option><option value="O-">O-</option>
                            <option value="AB+">AB+</option><option value="AB-">AB-</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Gender</label>
                        <select required>
                            <option value="" disabled selected>Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Aadhaar Number</label>
                        <input type="text" placeholder="12-digit Verification ID" maxlength="12" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Complete Address</label>
                    <input type="text" placeholder="Enter current residential address" required>
                </div>

                <div class="form-group">
                    <label>Emergency Contact</label>
                    <input type="tel" placeholder="Alternative contact number" required>
                </div>

                <div style="border-top: 1px solid var(--glass-border); margin: 20px 0; padding-top: 15px;">
                    <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; font-weight: 600;">Create Account Credentials</p>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Create Password</label>
                            <input type="password" placeholder="New Password" required>
                        </div>
                        <div class="form-group">
                            <label>Confirm Password</label>
                            <input type="password" placeholder="Confirm Password" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="primary-btn">Complete Registration</button>
                
                <div class="back-link" onclick="showLogin()">
                    ← Back to Login
                </div>
            </form>
        </div>

    </div>

    <!-- Interactive Logic -->
    <script>
        const appContainer = document.getElementById('appContainer');
        const loginView = document.getElementById('loginView');
        const registrationView = document.getElementById('registrationView');
        const loginForm = document.getElementById('loginForm');
        const rolePrompt = document.getElementById('rolePrompt');
        const subTitle = document.getElementById('subTitle');
        const regLink = document.getElementById('registerLink');
        const userIdLabel = document.getElementById('userIdLabel');
        const userIdInput = document.getElementById('userIdInput');
        const roleTabs = document.querySelectorAll('.role-tab');

        function selectRole(role, element) {
            roleTabs.forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');

            loginForm.classList.remove('hidden');
            loginForm.classList.add('fade-in');
            rolePrompt.innerText = `Sign in to your ${role.charAt(0).toUpperCase() + role.slice(1)} account`;

            if (role === 'donor') {
                userIdLabel.innerText = 'Application ID / Mobile Number';
                userIdInput.placeholder = 'Enter ID or Mobile';
                regLink.innerText = 'Sign Up as New Donor';
                regLink.classList.remove('hidden');
            } else if (role === 'hospital') {
                userIdLabel.innerText = 'Hospital Registration ID';
                userIdInput.placeholder = 'Enter Hospital ID';
                regLink.classList.add('hidden');
            } else if (role === 'admin') {
                userIdLabel.innerText = 'Admin Username';
                userIdInput.placeholder = 'Enter Admin ID';
                regLink.classList.add('hidden');
            }
        }

        // Redirect Logic to Donor Page
        function handleLogin(event) {
            event.preventDefault();
            const activeRole = document.querySelector('.role-tab.active').innerText.toLowerCase();
            
            if (activeRole === 'donor') {
                window.location.href = 'donor.html';
            } else {
                alert(activeRole.charAt(0).toUpperCase() + activeRole.slice(1) + ' dashboard is under construction.');
            }
        }

        function showRegistration() {
            loginView.classList.add('hidden');
            registrationView.classList.remove('hidden');
            registrationView.classList.add('fade-in');
            appContainer.style.maxWidth = "600px";
            subTitle.innerText = "Join the BloodConnect Network";
        }

        function showLogin() {
            registrationView.classList.add('hidden');
            loginView.classList.remove('hidden');
            loginView.classList.add('fade-in');
            appContainer.style.maxWidth = "450px";
            subTitle.innerText = "Select your role to continue";
        }

        function resetToHome() {
            showLogin();
            document.getElementById('tabDonor').click();
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = (currentTheme === 'dark') ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('bloodconnect_theme', newTheme);
            updateToggleButtonText(newTheme);
        }

        function initializeTheme() {
            const savedTheme = localStorage.getItem('bloodconnect_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                updateToggleButtonText(savedTheme);
            }
        }

        function updateToggleButtonText(theme) {
            const btn = document.getElementById('themeToggleButton');
            btn.innerText = (theme === 'dark') ? '☀️ Light Mode' : '🌑 Dark Mode';
        }

        window.addEventListener('DOMContentLoaded', initializeTheme);
    </script>
</body>
</html>
